[project]
name = "draftedi"
version = "1.3.1"
description = "EDI parser and validator for Python. Zero dependencies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Jackson Yaw", email = 'jacksonyawbiz@gmail.com'},
]
keywords = ["edi", "x12", "parser", "healthcare", "b2b", "integration", "ansi", "850", "810", "837", "parse-edi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
]
# Exact pins: a new ruff or mypy release must not turn CI red on its own.
# Bump these deliberately. CI and the publish workflow install this extra.
lint = [
    "ruff==0.15.22",
    "mypy==1.20.2",
]
dev = [
    "draftedi[test,lint]",
]

[project.urls]
Homepage = "https://github.com/yawway365/draftedi-core"
Repository = "https://github.com/yawway365/draftedi-core"
Issues = "https://github.com/yawway365/draftedi-core/issues"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
draftedi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "-q", "--timeout=30"]
markers = [
    "known_bug: marks tests for known parser bugs",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src"]  # Bare 'mypy' without files is unreliable; explicit src/ path ensures consistent discovery